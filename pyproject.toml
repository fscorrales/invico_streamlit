[tool.poetry]
name = "invico-streamlit"
version = "2.40.0"
description = "Dashboard de Control Presupuestario"
authors = ["Fernando Corrales <fscpython@gmail.com>"]
readme = "README.md"
packages = [{include = "src"}]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<3.15"
streamlit = "*"
pywinauto = "^0.6.9"
playwright = "1.58.0"
pydantic = "^2.6.0"
httpx = "0.27.2"
python-dotenv = "^1.0.1"
pandas = "2.3.3"
pydantic-settings = "^2.13.1"
xlrd = "^2.0.2"
pdfplumber = "^0.11.9"
openpyxl = "^3.1.5"
pyodbc = "^5.3.0"

[tool.poetry.group.dev.dependencies]
ruff = "^0.15.5"
pyinstaller = "^6.19.0"
typer = "^0.24.1"
rich = "^14.3.3"
ptpython = "^3.0.32"
gspread = "^6.2.1"
pytest = "^9.2.0"

[tool.pytest.ini_options]
# ``pythonpath`` es obligatorio: ``.vscode/settings.json`` ejecuta pytest con
# cwd en ``tests/``, por lo que sin la raíz del proyecto en sys.path fallarían
# los ``import src...``. Las rutas se resuelven relativas al rootdir (este
# archivo), no al cwd.
pythonpath = ["."]
testpaths = ["tests"]
# Los tests son unitarios y puros (DataFrame -> DataFrame): sin red, sin
# Streamlit. Cualquier test que necesite I/O debe marcarse explícitamente.
addopts = "-ra"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
